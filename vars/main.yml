---
# ansible_facts required by the role
__storage_required_facts:
  - architecture
  - distribution
  - distribution_major_version
  - distribution_version
  - os_family
  - pkg_mgr

# the subsets of ansible_facts that need to be gathered in case any of the
# facts in required_facts is missing; see the documentation of
# the 'gather_subset' parameter of the 'setup' module
__storage_required_facts_subsets: "{{ ['!all', '!min', 'devices'] +
  __storage_required_facts }}"

# Set flag for blivet to know if there is a kmod-kvdo package
__storage_uses_kmod_kvdo: "{{ __storage_is_rh_distro and
  ansible_facts['distribution_major_version'] | int < 10 }}"

__storage_stratis_packages:
  - stratisd
  - stratis-cli

# True when role variables request Stratis pool or volume management
__storage_manage_stratis: "{{ (storage_pool_defaults.type | default('lvm')) == 'stratis' or (storage_volume_defaults.type | default('lvm')) == 'stratis' or
  (storage_pools | default([]) | selectattr('type', 'defined') | selectattr('type', 'match', '^stratis$') | list | length > 0) or
  (storage_volumes | default([]) | selectattr('type', 'defined') | selectattr('type', 'match', '^stratis$') | list | length > 0) }}"

__storage_write_log_file: false

# BEGIN - DO NOT EDIT THIS BLOCK - rh distros variables
# Ansible distribution identifiers that the role treats like RHEL
__storage_rh_distros:
  - AlmaLinux
  - CentOS
  - RedHat
  - Rocky

# Same as above but includes Fedora
__storage_rh_distros_fedora: "{{ __storage_rh_distros + ['Fedora'] }}"

# Use this in conditionals to check if distro is Red Hat or clone
__storage_is_rh_distro: "{{ ansible_facts['distribution'] in __storage_rh_distros }}"

# Use this in conditionals to check if distro is Red Hat or clone, or Fedora
__storage_is_rh_distro_fedora: "{{ ansible_facts['distribution'] in __storage_rh_distros_fedora }}"

# Use these in conditionals to check if distro is Red Hat or clone of a specific major version
__storage_is_rh_distro_7: "{{ __storage_is_rh_distro and ansible_facts['distribution_major_version'] == '7' }}"
__storage_is_rh_distro_8: "{{ __storage_is_rh_distro and ansible_facts['distribution_major_version'] == '8' }}"
__storage_is_rh_distro_9: "{{ __storage_is_rh_distro and ansible_facts['distribution_major_version'] == '9' }}"
__storage_is_rh_distro_10: "{{ __storage_is_rh_distro and ansible_facts['distribution_major_version'] == '10' }}"
# END - DO NOT EDIT THIS BLOCK - rh distros variables
