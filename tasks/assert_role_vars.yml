# SPDX-License-Identifier: MIT
---
# Assisted by OpenCode using model GPT-6.2 Astra
- name: Validate TPM enrollment and encryption settings together
  ansible.builtin.assert:
    that:
      - item.encryption is not defined or item.encryption is none or (item.encryption | bool)
      - item.encryption_luks_version | d('luks2', true) == 'luks2'
      - >-
        item.encryption_tpm2.mode | d('enroll') != 'only' or
        (not (item.encryption_password | d(false)) and not (item.encryption_key | d(false)))
    fail_msg: TPM enrollment requires LUKS2, and TPM-only creation cannot include a user unlock credential.
  loop: >-
    {{ ((storage_volumes | d([])) +
        (storage_pools | d([]) | selectattr('volumes', 'defined') | map(attribute='volumes') | flatten))
       | selectattr('encryption_tpm2', 'defined') | rejectattr('encryption_tpm2', 'none') | list }}
  loop_control:
    label: "{{ item.name | d('unnamed') }}"
  when: item.state | d('present') == 'present'
  no_log: "{{ storage_secure_logging }}"

- name: Assert storage_use_partitions is null or a boolean
  ansible.builtin.assert:
    that:
      - >-
        (storage_use_partitions is none)
        or (storage_use_partitions is sameas true)
        or (storage_use_partitions is sameas false)
    fail_msg: >-
      storage_use_partitions must be null or a boolean,
      got {{ storage_use_partitions | type_debug }}

- name: Assert storage_disklabel_type is null or a string
  ansible.builtin.assert:
    that:
      - >-
        (storage_disklabel_type is none)
        or (storage_disklabel_type is string)
    fail_msg: >-
      storage_disklabel_type must be null or a string,
      got {{ storage_disklabel_type | type_debug }}

- name: Assert size in storage_volumes is a string, integer, or float
  ansible.builtin.assert:
    that:
      - >-
        item.size is string
        or (item.size | type_debug) == 'int'
        or (item.size | type_debug) == 'float'
      - >-
        (item.size is string and (item.size == '0'
        or item.size is match('^[1-9][0-9]*')))
        or ((item.size | type_debug) == 'int' and item.size >= 0)
        or ((item.size | type_debug) == 'float' and item.size >= 0)
    fail_msg: >-
      storage_volumes[{{ idx }}].size must be a non-negative integer
      or float, or a size string starting with a digit,
      got {{ item.size | type_debug }}: {{ item.size }}
  loop: "{{ storage_volumes | default([]) }}"
  no_log: "{{ storage_secure_logging }}"
  loop_control:
    index_var: idx
    label: "{{ item.name | d('unnamed') }}"
  when: item.size is defined

- name: Assert cache_size in storage_volumes is a string, integer, or float
  ansible.builtin.assert:
    that:
      - >-
        item.cache_size is string
        or (item.cache_size | type_debug) == 'int'
        or (item.cache_size | type_debug) == 'float'
      - >-
        (item.cache_size is string and (item.cache_size == '0'
        or item.cache_size is match('^[1-9][0-9]*')))
        or ((item.cache_size | type_debug) == 'int'
        and item.cache_size >= 0)
        or ((item.cache_size | type_debug) == 'float'
        and item.cache_size >= 0)
    fail_msg: >-
      storage_volumes[{{ idx }}].cache_size must be a non-negative
      integer or float, or a size string starting with a digit,
      got {{ item.cache_size | type_debug }}: {{ item.cache_size }}
  loop: "{{ storage_volumes | default([]) }}"
  no_log: "{{ storage_secure_logging }}"
  loop_control:
    index_var: idx
    label: "{{ item.name | d('unnamed') }}"
  when: item.cache_size is defined

- name: Assert size in pool volumes is a string, integer, or float
  ansible.builtin.assert:
    that:
      - >-
        item.1.size is string
        or (item.1.size | type_debug) == 'int'
        or (item.1.size | type_debug) == 'float'
      - >-
        (item.1.size is string and (item.1.size == '0'
        or item.1.size is match('^[1-9][0-9]*')))
        or ((item.1.size | type_debug) == 'int' and item.1.size >= 0)
        or ((item.1.size | type_debug) == 'float' and item.1.size >= 0)
    fail_msg: >-
      storage_pools[{{ item.0.name }}].volumes[].size must be
      a non-negative integer or float, or a size string starting
      with a digit, got {{ item.1.size | type_debug }}: {{ item.1.size }}
  loop: >-
    {{ storage_pools | default([])
       | subelements('volumes', skip_missing=True) }}
  no_log: "{{ storage_secure_logging }}"
  loop_control:
    label: "{{ item.0.name | d('unnamed') }}/{{ item.1.name | d('unnamed') }}"
  when: item.1.size is defined

- name: Assert cache_size in pool volumes is a string, integer, or float
  ansible.builtin.assert:
    that:
      - >-
        item.1.cache_size is string
        or (item.1.cache_size | type_debug) == 'int'
        or (item.1.cache_size | type_debug) == 'float'
      - >-
        (item.1.cache_size is string and (item.1.cache_size == '0'
        or item.1.cache_size is match('^[1-9][0-9]*')))
        or ((item.1.cache_size | type_debug) == 'int'
        and item.1.cache_size >= 0)
        or ((item.1.cache_size | type_debug) == 'float'
        and item.1.cache_size >= 0)
    fail_msg: >-
      storage_pools[{{ item.0.name }}].volumes[].cache_size must
      be a non-negative integer or float, or a size string
      starting with a digit,
      got {{ item.1.cache_size | type_debug }}: {{ item.1.cache_size }}
  loop: >-
    {{ storage_pools | default([])
       | subelements('volumes', skip_missing=True) }}
  no_log: "{{ storage_secure_logging }}"
  loop_control:
    label: "{{ item.0.name | d('unnamed') }}/{{ item.1.name | d('unnamed') }}"
  when: item.1.cache_size is defined
