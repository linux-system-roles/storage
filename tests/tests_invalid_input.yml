        - name: Assert volume cache_size as negative integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_vol_cache_size_neg_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject storage_volumes
              cache_size when given a negative integer

        # --- Test: pool volume size as negative integer ---
        - name: Assert rejects pool volume size as negative integer
          block:
            - name: Run role with pool volume size as negative integer
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_pools:
                  - name: testpool
                    disks: []
                    volumes:
                      - name: testvol
                        size: -10
          rescue:
            - name: Mark pool volume size negative rejected
              ansible.builtin.set_fact:
                __invalid_input_pool_vol_size_neg_failed: true
              when: >-
                'size must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert pool volume size as negative integer was rejected
          ansible.builtin.assert:
            that:
