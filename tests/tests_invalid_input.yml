# SPDX-License-Identifier: MIT
---
- name: Verify invalid parameters are rejected
  hosts: all
  tasks:
    - name: Run invalid input tests
      block:
        # ====================================================
        # Section 1: Verify role works with valid defaults
        # ====================================================
        - name: Run role with valid defaults
          ansible.builtin.include_role:
            name: linux-system-roles.storage

        # ====================================================
        # Section 2: argument_specs validation (Ansible 2.11+)
        # ====================================================
        - name: Run argument specs validation tests
          when: ansible_version.full is version("2.11", ">=")
          block:
            # --- Test: non-bool storage_safe_mode ---
            - name: Argument specs reject non-bool storage_safe_mode
              block:
                - name: Run role with non-bool storage_safe_mode
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_safe_mode: "not_a_bool"
              rescue:
                - name: Mark invalid storage_safe_mode type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_safe_mode_type_failed: true
                  when: >-
                    'is of type' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid storage_safe_mode type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_safe_mode_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_safe_mode
                  with a non-boolean value

            # --- Test: non-bool storage_udevadm_trigger ---
            - name: Argument specs reject non-bool storage_udevadm_trigger
              block:
                - name: Run role with non-bool storage_udevadm_trigger
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_udevadm_trigger: "not_a_bool"
              rescue:
                - name: Mark invalid storage_udevadm_trigger type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_udevadm_trigger_type_failed: true
                  when: >-
                    'is of type' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid storage_udevadm_trigger type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_udevadm_trigger_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_udevadm_trigger
                  with a non-boolean value

            # --- Test: non-list storage_volumes ---
            - name: Argument specs reject non-list storage_volumes
              block:
                - name: Run role with non-list storage_volumes
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes: "not_a_list"
              rescue:
                - name: Mark invalid storage_volumes type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_volumes_type_failed: true
                  when: >-
                    'is of type' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid storage_volumes type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_volumes_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  with a non-list value

            # --- Test: non-list storage_pools ---
            - name: Argument specs reject non-list storage_pools
              block:
                - name: Run role with non-list storage_pools
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_pools: "not_a_list"
              rescue:
                - name: Mark invalid storage_pools type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_pools_type_failed: true
                  when: >-
                    'is of type' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid storage_pools type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_pools_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_pools
                  with a non-list value

            # --- Test: missing required pool name ---
            - name: Argument specs reject pool missing required name
              block:
                - name: Run role with pool missing name
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_pools:
                      - type: lvm
                        disks: []
              rescue:
                - name: Mark missing pool name rejected
                  ansible.builtin.set_fact:
                    __invalid_input_pool_missing_name_failed: true
                  when: >-
                    'missing required arguments' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert missing pool name was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_pool_missing_name_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_pools
                  entries missing the required name field

            # --- Test: missing required volume name ---
            - name: Argument specs reject volume missing required name
              block:
                - name: Run role with volume missing name
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes:
                      - type: disk
                        disks: []
              rescue:
                - name: Mark missing volume name rejected
                  ansible.builtin.set_fact:
                    __invalid_input_vol_missing_name_failed: true
                  when: >-
                    'missing required arguments' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert missing volume name was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_vol_missing_name_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  entries missing the required name field

            # --- Test: invalid pool type choice ---
            - name: Argument specs reject invalid pool type
              block:
                - name: Run role with invalid pool type
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_pools:
                      - name: testpool
                        type: invalid_type
                        disks: []
              rescue:
                - name: Mark invalid pool type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_pool_type_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid pool type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_pool_type_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_pools
                  with invalid type value

            # --- Test: invalid volume state choice ---
            - name: Argument specs reject invalid volume state
              block:
                - name: Run role with invalid volume state
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes:
                      - name: testvol
                        state: invalid_state
              rescue:
                - name: Mark invalid volume state rejected
                  ansible.builtin.set_fact:
                    __invalid_input_vol_state_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid volume state was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_vol_state_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  with invalid state value

            # --- Test: invalid mount_device_identifier choice ---
            - name: Argument specs reject invalid mount_device_identifier
              block:
                - name: Run role with invalid mount_device_identifier
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes:
                      - name: testvol
                        mount_device_identifier: invalid_id
              rescue:
                - name: Mark invalid mount_device_identifier rejected
                  ansible.builtin.set_fact:
                    __invalid_input_mount_id_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid mount_device_identifier was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_mount_id_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
