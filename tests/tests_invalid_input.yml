        # --- Test: volume size as negative integer ---
        - name: Assert rejects volume size as negative integer
          block:
            - name: Run role with volume size as negative integer
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_volumes:
                  - name: testvol
                    type: disk
                    disks: []
