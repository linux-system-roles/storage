                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid cache_mode was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_cache_mode_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  with invalid cache_mode value

            # --- Test: invalid volume type choice ---
            - name: Argument specs reject invalid volume type
              block:
                - name: Run role with invalid volume type
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes:
                      - name: testvol
                        type: invalid_type
              rescue:
                - name: Mark invalid volume type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_vol_type_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid volume type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_vol_type_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  with invalid type value

            # --- Test: invalid part_type choice ---
            - name: Argument specs reject invalid part_type
              block:
                - name: Run role with invalid part_type
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_volumes:
                      - name: testvol
                        part_type: invalid_part
              rescue:
                - name: Mark invalid part_type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_part_type_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid part_type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_part_type_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_volumes
                  with invalid part_type value

            # --- Test: invalid pool raid_level choice ---
            - name: Argument specs reject invalid pool raid_level
              block:
                - name: Run role with invalid pool raid_level
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_pools:
                      - name: testpool
                        raid_level: invalid_level
                        disks: []
              rescue:
                - name: Mark invalid pool raid_level rejected
                  ansible.builtin.set_fact:
                    __invalid_input_pool_raid_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid pool raid_level was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_pool_raid_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_pools
                  with invalid raid_level value

            # --- Test: invalid encryption_clevis_pin choice ---
            - name: Argument specs reject invalid encryption_clevis_pin
              block:
                - name: Run role with invalid encryption_clevis_pin
                  ansible.builtin.include_role:
                    name: linux-system-roles.storage
                  vars:
                    storage_pools:
                      - name: testpool
                        encryption_clevis_pin: invalid_pin
                        disks: []
              rescue:
                - name: Mark invalid encryption_clevis_pin rejected
                  ansible.builtin.set_fact:
                    __invalid_input_clevis_pin_choice_failed: true
                  when: >-
                    'must be one of' in
                    (ansible_failed_result | default({}) | to_json)

            - name: Assert invalid encryption_clevis_pin was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_clevis_pin_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject storage_pools
                  with invalid encryption_clevis_pin value

        # ====================================================
        # Section 3: assert_role_vars validation (all versions)
        # ====================================================

        # --- Test: storage_use_partitions as string ---
        - name: Assert rejects storage_use_partitions as string
          block:
            - name: Run role with storage_use_partitions as string
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_use_partitions: "not_a_bool"
          rescue:
            - name: Mark storage_use_partitions string rejected
              ansible.builtin.set_fact:
                __invalid_input_use_partitions_str_failed: true
              when: >-
                'storage_use_partitions must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert storage_use_partitions as string was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_use_partitions_str_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject
              storage_use_partitions when given a string value

        # --- Test: storage_use_partitions as integer ---
        - name: Assert rejects storage_use_partitions as integer
          block:
            - name: Run role with storage_use_partitions as integer
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_use_partitions: 42
          rescue:
            - name: Mark storage_use_partitions integer rejected
              ansible.builtin.set_fact:
                __invalid_input_use_partitions_int_failed: true
              when: >-
                'storage_use_partitions must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert storage_use_partitions as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_use_partitions_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject
              storage_use_partitions when given an integer value

        # --- Test: storage_disklabel_type as integer ---
        - name: Assert rejects storage_disklabel_type as integer
          block:
            - name: Run role with storage_disklabel_type as integer
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_disklabel_type: 123
          rescue:
            - name: Mark storage_disklabel_type integer rejected
              ansible.builtin.set_fact:
                __invalid_input_disklabel_type_int_failed: true
              when: >-
                'storage_disklabel_type must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert storage_disklabel_type as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_disklabel_type_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject
              storage_disklabel_type when given an integer value

        # --- Test: storage_disklabel_type as boolean ---
        - name: Assert rejects storage_disklabel_type as boolean
          block:
            - name: Run role with storage_disklabel_type as boolean
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_disklabel_type: true
          rescue:
            - name: Mark storage_disklabel_type boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_disklabel_type_bool_failed: true
              when: >-
                'storage_disklabel_type must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert storage_disklabel_type as boolean was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_disklabel_type_bool_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject
              storage_disklabel_type when given a boolean value

        # --- Test: volume size as boolean ---
        - name: Assert rejects volume size as boolean
          block:
            - name: Run role with volume size as boolean
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_volumes:
                  - name: testvol
                    type: disk
                    disks: []
                    size: true
          rescue:
            - name: Mark volume size boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_vol_size_bool_failed: true
              when: >-
                'size must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert volume size as boolean was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_vol_size_bool_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject storage_volumes
              size when given a boolean value

        # --- Test: volume cache_size as boolean ---
        - name: Assert rejects volume cache_size as boolean
          block:
            - name: Run role with volume cache_size as boolean
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_volumes:
                  - name: testvol
                    type: disk
                    disks: []
                    cache_size: true
          rescue:
            - name: Mark volume cache_size boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_vol_cache_size_bool_failed: true
              when: >-
                'cache_size must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert volume cache_size as boolean was rejected
          ansible.builtin.assert:
            that:
