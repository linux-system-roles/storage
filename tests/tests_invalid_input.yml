          rescue:
            - name: Mark volume size negative rejected
              ansible.builtin.set_fact:
                __invalid_input_vol_size_neg_failed: true
              when: >-
                'size must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert volume size as negative integer was rejected
          ansible.builtin.assert:
            that:
