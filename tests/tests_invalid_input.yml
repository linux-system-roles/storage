              cache_size when given a boolean value

        # --- Test: pool volume size as boolean ---
        - name: Assert rejects pool volume size as boolean
          block:
            - name: Run role with pool volume size as boolean
              ansible.builtin.include_role:
                name: linux-system-roles.storage
              vars:
                storage_pools:
                  - name: testpool
                    disks: []
                    volumes:
                      - name: testvol
                        size: true
          rescue:
            - name: Mark pool volume size boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_pool_vol_size_bool_failed: true
              when: >-
                'size must be' in
                (ansible_failed_result | default({}) | to_json)

        - name: Assert pool volume size as boolean was rejected
          ansible.builtin.assert:
            that:
