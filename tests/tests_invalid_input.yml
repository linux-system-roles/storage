      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __invalid_input_safe_mode_type_failed:
            __invalid_input_udevadm_trigger_type_failed:
            __invalid_input_volumes_type_failed:
            __invalid_input_pools_type_failed:
            __invalid_input_pool_missing_name_failed:
            __invalid_input_vol_missing_name_failed:
            __invalid_input_pool_type_choice_failed:
            __invalid_input_vol_state_choice_failed:
            __invalid_input_mount_id_choice_failed:
            __invalid_input_cache_mode_choice_failed:
            __invalid_input_vol_type_choice_failed:
            __invalid_input_part_type_choice_failed:
            __invalid_input_pool_raid_choice_failed:
            __invalid_input_clevis_pin_choice_failed:
            __invalid_input_use_partitions_str_failed:
            __invalid_input_use_partitions_int_failed:
            __invalid_input_disklabel_type_int_failed:
            __invalid_input_disklabel_type_bool_failed:
            __invalid_input_vol_size_bool_failed:
            __invalid_input_vol_cache_size_bool_failed:
            __invalid_input_pool_vol_size_bool_failed:
            __invalid_input_pool_vol_cache_size_bool_failed:
            __invalid_input_vol_size_neg_failed:
            __invalid_input_vol_cache_size_neg_failed:
            __invalid_input_pool_vol_size_neg_failed:
            __invalid_input_pool_vol_cache_size_neg_failed:
          tags: tests::cleanup
